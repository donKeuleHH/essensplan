  <link rel="stylesheet" href="style.css">
  <script>
    // Gewählte Farbvariante sofort setzen, damit beim Start nichts aufblitzt.
    try {
      var s = localStorage.getItem("essensplan-skin");
      var k = {pastell: ["#f7e6e4", "light"], tusche: ["#f1f0e2", "light"], sturm: ["#2e3c4a", "dark"], nacht: ["#121212", "dark"]}[s];
      if (k) {
        document.documentElement.dataset.skin = s;
        document.querySelector('meta[name="theme-color"]').content = k[0];
        document.querySelector('meta[name="color-scheme"]').content = k[1];
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-inhalt">
      <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 3C20.4 3 11 11.9 11 23c0 15 21 38 21 38s21-23 21-38C53 11.9 43.6 3 32 3z" fill="var(--akzent)"/>
        <g fill="none" stroke="var(--auf-akzent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M25.5 14v8M32 14v8M38.5 14v8"/><path d="M25.5 22c0 3.6 2.7 5.2 6.5 5.2s6.5-1.6 6.5-5.2"/><path d="M32 27.5V42"/>
        </g>
      </svg>
      <div class="splash-name">Meal<span>Map</span></div>
      <div class="splash-zeile">Dein Wochenplan</div>
    </div>
  </div>

  <header>
    <h1 id="titel">Gerichte</h1>
    <div class="kopf-rechts">
      <button id="sync-knopf" class="sync-knopf" type="button" hidden></button>
      <button id="einstellungen-knopf" class="zahnrad" type="button" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="gerichte" class="ansicht aktiv"></section>

    <section id="wochenplan" class="ansicht"></section>

    <section id="einkauf" class="ansicht"></section>
  </main>

  <footer class="version">Version 4.5.2 · Neues Icon</footer>

  <nav>
    <button class="aktiv" data-ziel="gerichte" data-titel="Gerichte">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a3 3 0 0 0 6 0V3"/><path d="M9 3v18"/><path d="M18 21V3c-2.6 1.6-4 4.6-4 8 0 2 1 3 2 3h2"/></svg>Gerichte
    </button>
    <button data-ziel="wochenplan" data-titel="Wochenplan">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Wochenplan
    </button>
    <button data-ziel="einkauf" data-titel="Einkaufsliste">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 11h10.6L20 7H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Einkauf
    </button>
  </nav>

  <!-- Vollbild-Ansicht für Detail und Formular -->
  <div id="blatt" class="blatt" hidden></div>

  <!-- Vorschläge für Zutaten (wird von app.js gefüllt) -->
  <datalist id="zutatenvorschlaege"></datalist>
  <datalist id="extravorschlaege"></datalist>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
