<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essensplan</title>
  <meta name="theme-color" content="#051f2b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="titel">Gerichte</h1>
    <button id="sync-knopf" class="sync-knopf" type="button" hidden></button>
  </header>

  <main>
    <section id="gerichte" class="ansicht aktiv"></section>

    <section id="wochenplan" class="ansicht"></section>

    <section id="einkauf" class="ansicht"></section>
  </main>

  <footer class="version">Version 0.5 · Synchronisierung</footer>

  <nav>
    <button class="aktiv" data-ziel="gerichte" data-titel="Gerichte">
      <span class="symbol">🍽️</span>Gerichte
    </button>
    <button data-ziel="wochenplan" data-titel="Wochenplan">
      <span class="symbol">📅</span>Wochenplan
    </button>
    <button data-ziel="einkauf" data-titel="Einkaufsliste">
      <span class="symbol">🛒</span>Einkauf
    </button>
  </nav>

  <!-- Vollbild-Ansicht für Detail und Formular -->
  <div id="blatt" class="blatt" hidden></div>

  <!-- Vorschläge für Zutaten (wird von app.js gefüllt) -->
  <datalist id="zutatenvorschlaege"></datalist>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
