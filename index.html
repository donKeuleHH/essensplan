<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essensplan</title>
  <meta name="theme-color" content="#2a313c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="titel">Gerichte</h1>
    <button id="sync-knopf" class="sync-knopf" type="button" hidden></button>
  </header>

  <main>
    <section id="gerichte" class="ansicht aktiv"></section>

    <section id="wochenplan" class="ansicht"></section>

    <section id="einkauf" class="ansicht"></section>
  </main>

  <footer class="version">Version 1.8 · Sporttage</footer>

  <nav>
    <button class="aktiv" data-ziel="gerichte" data-titel="Gerichte">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a3 3 0 0 0 6 0V3"/><path d="M9 3v18"/><path d="M18 21V3c-2.6 1.6-4 4.6-4 8 0 2 1 3 2 3h2"/></svg>Gerichte
    </button>
    <button data-ziel="wochenplan" data-titel="Wochenplan">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Wochenplan
    </button>
    <button data-ziel="einkauf" data-titel="Einkaufsliste">
      <svg class="nav-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 11h10.6L20 7H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Einkauf
    </button>
  </nav>

  <!-- Vollbild-Ansicht für Detail und Formular -->
  <div id="blatt" class="blatt" hidden></div>

  <!-- Vorschläge für Zutaten (wird von app.js gefüllt) -->
  <datalist id="zutatenvorschlaege"></datalist>
  <datalist id="extravorschlaege"></datalist>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
